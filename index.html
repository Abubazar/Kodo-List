<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kodo List</title>
    <script src="script.js" defer></script>
    <script src="canvas.js" defer></script>
    <script src="historyManager.js"></script>
  </head>
  <style>
    :root {
      --bg-color: rgb(21, 10, 0);
      --bg-border: rgb(74, 38, 4);

      --menu-bg: rgb(33, 16, 0);

      --canvas-color: rgb(41, 20, 0);
      --canvas-dots: rgb(74, 38, 4);
      --node: rgb(135, 65, 0);
      --node-border: rgb(219, 140, 65);
      --node-rope: rgb(254, 197, 144);

      --btn-bg-1: #00000000;
      --btn-bg-empty-1: rgba(74, 38, 4, 0.439);

      --text: rgb(247, 185, 128);

      --transition: all 0.2s ease;
    }

    :root[data-theme="light"] {
      --bg-color: rgb(255, 239, 224);
      --bg-border: rgb(243, 169, 100);

      --menu-bg: rgb(255, 225, 197);

      --canvas-color: rgb(255, 210, 168);
      --canvas-dots: rgb(209, 130, 57);
      --node: rgb(245, 169, 98);
      --node-border: rgb(219, 140, 65);
      --node-rope: rgb(226, 166, 109);

      --btn-bg-1: #00000000;
      --btn-bg-empty-1: rgba(150, 126, 104, 0.439);

      --text: rgb(144, 70, 0);
    }

    body,
    html {
      margin: 0;
      background-color: var(--bg-color);
      font-family: monospace;
      color: var(--text);
    }
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .toolbar {
      padding: 0 10px;
      margin: 0;
      display: flex;
      border-bottom: 2px solid var(--bg-border);
    }
    .toolbar button {
      background-color: var(--btn-bg-1);
      border: none;
      padding: 10px;
      color: var(--text);
      font-family: monospace;
    }
    .toolbar button:hover {
      background-color: var(--btn-bg-empty-1);
      transition: var(--transition);
    }
    .mainInterface {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;

      display: grid;
      grid-template-columns: minmax(200px, 25%) 1fr;
    }
    .options {
      border-right: 2px solid var(--bg-border);
      height: 100%;
      box-sizing: border-box;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
      overflow-y: auto;
    }
    .options section {
      display: flex;
      flex-direction: column;
      padding: 10px 10px;
      color: var(--text);
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.424);
    }
    .canvasArea {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--canvas-color);
      overflow: hidden;
    }
    #mainCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: var(--canvas-color);
    }

    .menu {
      background-color: var(--menu-bg);
      padding: 0;
      margin: 0;
      position: absolute;
      display: flex;
      flex-direction: column;
      max-width: fit-content;
      z-index: 100;
    }
    .menu button {
      padding: 10px 15px;
      border: none;
      color: var(--text);
      text-align: left;
      background-color: var(--menu-bg);
      font-family: monospace;
    }
    .menu button span {
      margin-left: 30px;
      opacity: 0.5;
      font-size: smaller;
    }
    .menu button:hover {
      background-color: var(--btn-bg-empty-1);
      transition: var(--transition);
    }

    .addTodoBtn {
      padding: 10px;
      border: 1px solid var(--bg-border);
      background-color: var(--menu-bg);
      color: var(--text);
      font-family: monospace;
      cursor: pointer;
    }

    .addTodoBtn:hover {
      background-color: var(--btn-bg-empty-1);
      transition: var(--transition);
    }

    .noSelection {
      color: var(--text);
      opacity: 0.5;
      font-size: smaller;
      text-align: center;
      padding: 20px 5px;
    }

    .todoEditor {
      display: none;
      flex-direction: column;
      padding: 10px;
      color: var(--text);
      gap: 10px;
      background-color: rgba(0, 0, 0, 0.424);
    }

    .todoEditor label {
      font-size: smaller;
      opacity: 0.7;
    }

    .todoEditor input[type="text"] {
      background-color: var(--bg-color);
      border: 1px solid var(--bg-border);
      padding: 8px;
      color: var(--text);
      font-family: monospace;
      outline: none;
    }

    .todoEditor input[type="text"]:focus {
      border-color: var(--node-border);
    }

    .doneOption {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .panelTop {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-bottom: 10px;
      border-bottom: 1px solid var(--bg-border);

      color: var(--text);
    }

    .panelTitle {
      font-size: 16px;
      font-weight: bold;
    }
    .themeBtn {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--bg-border);

      background-color: var(--menu-bg);
      color: var(--text);

      font-family: monospace;

      cursor: pointer;
    }

    .themeBtn:hover {
      background-color: var(--btn-bg-empty-1);
      transition: var(--transition);
    }
    .deleteTodoBtn {
      margin-top: 10px;

      padding: 8px 10px;

      border: 1px solid var(--bg-border);

      background-color: transparent;

      color: var(--text);

      font-family: monospace;

      cursor: pointer;
    }

    .deleteTodoBtn:hover {
      background-color: var(--btn-bg-empty-1);
      transition: var(--transition);
    }

    dialog {
      border: 1px solid var(--bg-border);
      background-color: var(--menu-bg);
      color: var(--text);
      padding: 0;
      font-family: monospace;
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.6);
    }

    .dialogContent {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
      min-width: 300px;
    }

    .dialogHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .closeDialog {
      border: none;
      background: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .dialogContent input {
      background-color: var(--bg-color);
      border: 1px solid var(--bg-border);
      padding: 10px;
      color: var(--text);
      font-family: monospace;
      outline: none;
    }

    .dialogContent input:focus {
      border-color: var(--node-border);
    }

    .dialogButtons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .dialogButtons button {
      padding: 8px 12px;
      border: 1px solid var(--bg-border);
      background-color: var(--bg-color);
      color: var(--text);
      font-family: monospace;
      cursor: pointer;
    }

    .dialogButtons button:hover {
      background-color: var(--btn-bg-empty-1);
      transition: var(--transition);
    }
  </style>
  <body>
    <section class="toolbar"></section>

    <section class="mainInterface">
      <div class="options">
        <div class="panelTop">
          <span class="panelTitle">Kodo List</span>
          <button class="themeBtn" id="themeBtn" title="Toggle theme">☀</button>
        </div>
        <button class="addTodoBtn" id="addTodoBtn">+ Add ToDo</button>
        <div class="noSelection">No ToDo selected</div>
        <section class="todoEditor" id="todoEditor">
          <label for="todoTitle"> ToDo </label>
          <input type="text" id="todoTitle" placeholder="ToDo title" />
          <label class="doneOption">
            <input type="checkbox" id="todoDone" />
            <span>Done</span>
          </label>
          <button class="deleteTodoBtn" id="deleteTodoBtn">Delete ToDo</button>
        </section>
      </div>
      <div class="canvasArea" id="canvasHolder">
        <canvas id="mainCanvas"></canvas>
      </div>
    </section>

    <dialog id="addTodoDialog">
      <div class="dialogContent">
        <div class="dialogHeader">
          <span>Add ToDo</span>

          <button class="closeDialog">×</button>
        </div>

        <input
          type="text"
          id="newTodoInput"
          placeholder="What do you need to do?"
        />

        <div class="dialogButtons">
          <button class="cancelBtn">Cancel</button>

          <button class="createBtn">Create</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
